trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self

# Install Snyk CLI
- script: |
    curl https://static.snyk.io/cli/latest/snyk-linux -o snyk
    chmod +x snyk
    sudo mv snyk /usr/local/bin/
  displayName: 'Install Snyk CLI'

# Authenticate
- script: snyk auth $(SNYK_TOKEN)
  displayName: 'Authenticate Snyk'

# Code & Dependency Scan
- script: snyk test --severity-threshold=medium
  displayName: 'Snyk Code & Dependency Scan'

# Generate HTML Report
- script: snyk test --json > snyk-report.json
  displayName: "Generate Snyk JSON Report"

# Upload Report as Pipeline Artifact
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'snyk-report.json'
    artifact: 'snyk-report'
    publishLocation: 'pipeline'
  displayName: 'Publish Snyk Report'
